[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchlab-pycore"
version = "0.5.2"
description = "BENCHLAB PyCore - Python Interface for BENCHLAB"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Pieter Plaisier", email = "contact@benchlab.io"}
]
keywords = ["telemetry", "hardware", "benchlab", "sensors"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "pyserial >= 3.5"
]

[project.urls]
Homepage = "https://github.com/BenchLab-io/benchlab-pycore"
Issues = "https://github.com/BenchLab-io/benchlab-pycore/issues"

[tool.setuptools.packages.find]
include = ["benchlab_pycore*"]

[tool.setuptools.package-data]
"benchlab_pycore.contracts" = ["*.json"]

[tool.pytest.ini_options]
# tests/test_device.py and tests/test_write_validation.py are interactive
# hardware scripts, not unit tests: they are shaped like test_* functions that
# take arguments, so pytest miscollects them as missing fixtures. Ignored by
# path so that "pytest tests/" works locally and in CI alike; run them directly
# with python when a board is attached.
addopts = "--ignore=tests/test_device.py --ignore=tests/test_write_validation.py"

