name: release

# Builds and publishes a tagged release. Triggered by pushing a tag like
# v0.5.2 — the tag version must match both pyproject.toml and setup.cfg.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import re; print(re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          SETUPCFG_VERSION=$(python -c "import re; print(re.search(r'version = ([^\s]+)', open('setup.cfg').read()).group(1))")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SETUPCFG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match setup.cfg version $SETUPCFG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest build

      - name: Run test suite
        run: pytest tests/test_config.py tests/test_core.py -v

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # migrate.md tracks breaking changes and new features per version --
          # attach it so downstream tools can check compatibility for this
          # exact release without cloning the repo at a matching commit.
          files: |
            dist/*
            migrate.md
