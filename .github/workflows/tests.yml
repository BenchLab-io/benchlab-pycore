name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the version we ship on. The contract loader
        # uses importlib.resources.files(), so the floor is worth testing.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        # Whole directory, not named files: a new test file must not be able to
        # silently never run. Hardware scripts are excluded via pyproject.toml.
        run: pytest tests/ -v
