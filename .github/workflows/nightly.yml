name: nightly

# Builds main once a day and publishes a single rolling "nightly" GitHub
# prerelease. Skips the build entirely if main hasn't changed since the
# last nightly, and replaces the previous nightly release/tag each run so
# only one nightly is ever kept.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare main HEAD to last nightly tag
        id: check
        shell: bash
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          NIGHTLY_SHA=$(git rev-parse refs/tags/nightly 2>/dev/null || echo "")
          if [ "$HEAD_SHA" = "$NIGHTLY_SHA" ]; then
            echo "No new commits since last nightly ($NIGHTLY_SHA); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since last nightly; proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, test, and publish nightly
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest build
      - name: Run test suite
        run: pytest tests/test_config.py tests/test_core.py -v
      - name: Build sdist and wheel
        run: python -m build
      - name: Remove previous nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag || true
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
